  <meta name="description" content="Centro La Ruche — Un’opera vivente, una scuola vocazionale">

  <meta name="theme-color" content="#efe7dd">
  <meta property="og:locale" content="it_IT">

  <!-- Canonical -->
  <link rel="canonical" href="https://centrolaruche.it/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Centro La Ruche — Un’opera vivente, una scuola vocazionale">
  <meta property="og:description" content="Centro La Ruche — Un’opera vivente, una scuola vocazionale">
  <meta property="og:image" content="https://centrolaruche.it/og-image.jpg">
  <meta property="og:image:width" content="1200">

  <meta property="og:site_name" content="Centro La Ruche">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Centro La Ruche — Un’opera vivente, una scuola vocazionale">
  <meta name="twitter:description" content="Centro La Ruche — Un’opera vivente, una scuola vocazionale">
  <meta name="twitter:image" content="https://centrolaruche.it/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css?v=1002" />

  <!-- EB Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>

<body>
  <main class="hero" aria-label="Hero Centro La Ruche">

    <!-- Hamburger -->
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Overlay MENU -->
    <div class="menu-overlay" aria-hidden="true">
      <nav class="menu-content" role="dialog" aria-label="Menu">
        <a href="index.html" class="menu-link">Home</a>
        <a href="la-prima-ruche.html" class="menu-link">La Rûche 1904–1917</a>
        <button class="menu-link" type="button" id="open-seconda">La Ruche</button>
        <button class="menu-link" type="button" id="open-contatti">Contatti</button>
      </nav>
    </div>
  </main>

  <!-- Overlay SECONDA RÛCHE -->
  <div id="seconda-ruche" class="seconda-overlay" aria-hidden="true">
    <div class="seconda-content" role="dialog" aria-label="In arrivo">
      <p>In arrivo</p>
    </div>
  </div>

  <!-- Overlay CONTATTI -->
  <div id="contatti-overlay" class="seconda-overlay" aria-hidden="true">
    <div class="seconda-content" role="dialog">
      <a href="mailto:centrolaruche@gmail.com" class="contatti-mail">
        centrolaruche@gmail.com
      </a>
    </div>
  </div>

  <script>
    const btn = document.querySelector('.menu-btn');
    const menuOverlay = document.querySelector('.menu-overlay');
    const secondaOverlay = document.getElementById('seconda-ruche');
    const openSecondaBtn = document.getElementById('open-seconda');
    const secondaContent = secondaOverlay.querySelector('.seconda-content');
    const openContattiBtn = document.getElementById('open-contatti');
    const contattiOverlay = document.getElementById('contatti-overlay');

    function openMenu() {
      menuOverlay.classList.add('open');
      menuOverlay.setAttribute('aria-hidden', 'false');
      btn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      menuOverlay.classList.remove('open');
      menuOverlay.setAttribute('aria-hidden', 'true');
      btn.setAttribute('aria-expanded', 'false');
    }

    function openSeconda() {
      closeMenu();
      secondaOverlay.classList.add('open');
      secondaOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeSeconda() {
      secondaOverlay.classList.remove('open');
      secondaOverlay.setAttribute('aria-hidden', 'true');
    }

    function openContatti() {
      closeMenu();
      contattiOverlay.classList.add('open');
      contattiOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeContatti() {
      contattiOverlay.classList.remove('open');
      contattiOverlay.setAttribute('aria-hidden', 'true');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuOverlay.classList.contains('open') ? closeMenu() : openMenu();
    });

    menuOverlay.addEventListener('click', closeMenu);

    openSecondaBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openSeconda();
    });

    secondaOverlay.addEventListener('click', closeSeconda);
    secondaContent.addEventListener('click', (e) => e.stopPropagation());

    openContattiBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openContatti();
    });

    contattiOverlay.addEventListener('click', closeContatti);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
        closeSeconda();
        closeContatti();
      }
    });
  </script>
</body>
</html>
