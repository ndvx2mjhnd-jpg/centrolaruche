<!-- index.html -->
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centro La Ruche</title>
  <!-- se hai problemi di cache, cambia v=1 in v=2, v=3... -->
  <link rel="stylesheet" href="./style.css?v=1" />
</head>

<body>
  <main class="hero" aria-label="Hero Centro La Ruche">
    <!-- Email cliccabile -->
    <a class="email" href="mailto:centrolaruche@gmail.com">centrolaruche@gmail.com</a>

    <!-- Hamburger -->
    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Overlay menu -->
    <div class="menu-overlay" aria-hidden="true">
      <div class="menu-content" role="dialog" aria-label="Menu">
        <p>In arrivo</p>
      </div>
    </div>
  </main>

  <script>
    const btn = document.querySelector('.menu-btn');
    const overlay = document.querySelector('.menu-overlay');

    function openMenu() {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      btn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      overlay.classList.contains('open') ? closeMenu() : openMenu();
    });

    overlay.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenu();
    });
  </script>
</body>
</html>
