<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centro La Ruche</title>
  <link rel="stylesheet" href="./style.css?v=999" />
</head>

<body>
  <main class="hero" aria-label="Hero Centro La Ruche">
    <a class="email" href="mailto:centrolaruche@gmail.com">centrolaruche@gmail.com</a>

    <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="menu-overlay" aria-hidden="true">
      <div class="menu-content" role="dialog" aria-label="Menu">
        <a href="la-prima-ruche.html" class="menu-link">La prima Ruche</a>

        <button class="menu-link" type="button" onclick="openSecondaRuche()">
          La seconda Ruche
        </button>
      </div>
    </div>
  </main>

  <div id="seconda-ruche" class="overlay" aria-hidden="true">
    <div class="overlay-content" role="dialog" aria-label="Lavori in corso">
      <p>Lavori in corso</p>
      <button type="button" class="overlay-close" onclick="closeSecondaRuche()">Chiudi</button>
    </div>
  </div>

  <script>
    const btn = document.querySelector('.menu-btn');
    const menuOverlay = document.querySelector('.menu-overlay');
    const secondaRuche = document.getElementById('seconda-ruche');

    function openMenu() {
      menuOverlay.classList.add('open');
      menuOverlay.setAttribute('aria-hidden', 'false');
      btn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      menuOverlay.classList.remove('open');
      menuOverlay.setAttribute('aria-hidden', 'true');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuOverlay.classList.contains('open') ? closeMenu() : openMenu();
    });

    menuOverlay.addEventListener('click', closeMenu);

    function openSecondaRuche() {
      closeMenu();
      secondaRuche.style.display = 'flex';
      secondaRuche.setAttribute('aria-hidden', 'false');
    }

    function closeSecondaRuche() {
      secondaRuche.style.display = 'none';
      secondaRuche.setAttribute('aria-hidden', 'true');
    }

    secondaRuche.addEventListener('click', closeSecondaRuche);
    document.querySelector('.overlay-content').addEventListener('click', (e) => e.stopPropagation());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
        closeSecondaRuche();
      }
    });
  </script>
</body>
</html>
